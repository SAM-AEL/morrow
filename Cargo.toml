[workspace]
resolver = "2"
members = [
    "crates/morrow-core",
    "crates/morrow-provider",
    "crates/morrow-tools",
    "crates/morrow-agent",
    "crates/morrow-tui",
    "crates/morrow-server",
    "crates/morrow-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
sha2 = "0.10"
rand = "0.8"

morrow-core = { path = "crates/morrow-core" }
morrow-provider = { path = "crates/morrow-provider" }
morrow-tools = { path = "crates/morrow-tools" }
morrow-agent = { path = "crates/morrow-agent" }
morrow-tui = { path = "crates/morrow-tui" }
morrow-server = { path = "crates/morrow-server" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
regex = "1"
glob = "0.3"
ignore = "0.4"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
